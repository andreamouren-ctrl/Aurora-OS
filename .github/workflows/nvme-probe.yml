name: Aurora NVMe Probe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'kernel/**'
      - 'services/**'
      - 'scripts/**'
      - 'linker/**'
      - 'Makefile'
      - 'limine.conf'
      - '.github/workflows/nvme-probe.yml'

jobs:
  nvme-probe-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # v6/v7 currently fail before step execution in this repository's Actions environment.
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make xorriso curl git binutils python3 qemu-system-x86

      - name: Build Aurora OS
        run: make BOOT_VALIDATION=1 iso

      - name: Prepare signed NVMe image
        run: |
          truncate -s 64M build/aurora-nvme.img
          # The signed raw NVMe image is intentionally excluded from AuroraFS.
          # Supply a separate AHCI scratch disk for /system and G5/Identity durable probes.
          truncate -s 64M build/aurora-nvme-system.img
          printf 'AURORA-NVME-RW-TEST-V1' | dd of=build/aurora-nvme.img bs=512 seek=131071 conv=notrunc status=none

      - name: NVMe read write flush smoke boot
        run: |
          set -u

          SERIAL_LOG=build/qemu-nvme-serial.log
          DEBUG_LOG=build/qemu-nvme-debug.log
          IMAGE=build/aurora-nvme.img
          rm -f "$SERIAL_LOG" "$DEBUG_LOG"

          set +e
          # BOOT_VALIDATION=1 must exercise the trusted RDSEED security gate.
          # Use the validated Identity entropy QEMU CPU profile; never bypass this check.
          timeout 90s qemu-system-x86_64 \
            -M q35 \
            -cpu max \
            -m 512M \
            -smp 4,sockets=1,cores=2,threads=2 \
            -vga std \
            -cdrom build/AuroraOS-x86_64.iso \
            -boot d \
            -drive file="$IMAGE",format=raw,if=none,id=nvme0 \
            -device nvme,serial=AURORA-NVME-CI,drive=nvme0 \
            -drive file=build/aurora-nvme-system.img,format=raw,if=none,id=system0 \
            -device ide-hd,drive=system0 \
            -serial file:"$SERIAL_LOG" \
            -d int,cpu_reset \
            -D "$DEBUG_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "NVMe QEMU exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora NVMe serial log ====="
          cat "$SERIAL_LOG"

          grep -F "[storage] NVMe controller PCI" "$SERIAL_LOG"
          grep -F "[nvme] BAR0 physical:" "$SERIAL_LOG"
          grep -F "[nvme] PCI/BAR/MMIO capability probe passed" "$SERIAL_LOG"
          grep -F "[nvme] Admin Queue initialized and controller ready" "$SERIAL_LOG"
          grep -F "[nvme] Identify Controller + Namespace 1 passed" "$SERIAL_LOG"
          grep -F "[nvme] I/O Submission/Completion Queue pair initialized" "$SERIAL_LOG"
          grep -F "[storage] block device registered: nvme-ns1" "$SERIAL_LOG"
          grep -F "[nvme] NVM Read LBA0 via block layer verified" "$SERIAL_LOG"
          grep -F "[nvme] NVM Write + Flush reversible probe verified" "$SERIAL_LOG"
          grep -F "[nvme] dedicated reversible-probe media; filesystem bootstrap skipped" "$SERIAL_LOG"
          grep -F "[aurorafs-v2] mounted at /system via common filesystem framework" "$SERIAL_LOG"
          grep -F "[ring3-entropy] capability-gated trusted seed syscall probe passed" "$SERIAL_LOG"
          grep -F "[kernel] M1 user-space bootstrap reached successfully" "$SERIAL_LOG"

          printf 'AURORA-NVME-RW-TEST-V1' > build/nvme-expected-signature.bin
          dd if="$IMAGE" of=build/nvme-restored-signature.bin bs=512 skip=131071 count=1 status=none
          cmp -n 22 build/nvme-expected-signature.bin build/nvme-restored-signature.bin

      - name: Upload NVMe logs
        if: always()
        # Keep v4 with checkout v4 until newer action majors are accepted by this Actions environment.
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-NVMe-Probe
          path: |
            build/qemu-nvme-serial.log
            build/qemu-nvme-debug.log
