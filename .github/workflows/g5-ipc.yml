name: G5 IPC Wire Contract
on:
  push:
    paths:
      - 'kernel/include/aurora/g5_ipc_abi.h'
      - 'kernel/src/ipc/g5_ipc_codec.c'
      - 'tests/g5/ipc_codec_test.c'
      - 'tests/g5/ipc_schema_test.c'
      - 'tests/g5/ipc_semantics_test.c'
      - 'tests/g5/ipc_dispatch_test.c'
      - 'tests/g5/ipc_reentry_test.c'
      - 'tests/g5/ipc_concurrency_test.c'
      - 'tests/g5/session_context_test.c'
      - 'kernel/src/graphics/g5_session_context.c'
      - 'kernel/include/aurora/g5_session_context.h'
      - 'tests/g5/ipc_pending_test.c'
      - 'tests/g5/ipc_durable_test.c'
      - 'kernel/include/aurora/g5_ipc_durable.h'
      - 'kernel/src/ipc/g5_ipc_durable.c'
      - 'kernel/include/aurora/g5_ipc_endpoint.h'
      - 'kernel/src/ipc/g5_ipc_endpoint.c'
      - 'kernel/src/ipc/g5_ipc_endpoint_probe.c'
      - 'kernel/include/aurora/g5_ipc_pending.h'
      - 'kernel/src/ipc/g5_ipc_pending.c'
      - 'tests/g5/ipc_session_test.c'
      - 'kernel/include/aurora/g5_ipc_dispatch.h'
      - 'kernel/src/ipc/g5_ipc_dispatch.c'
      - 'kernel/src/ipc/g5_ipc_cap_adapter.c'
      - 'kernel/include/aurora/g5_ipc_cap_adapter.h'
      - 'tests/g5/ipc_cap_adapter_test.c'
      - 'tests/g5/ipc_authorized_dispatch_test.c'
      - 'kernel/include/aurora/g5_ipc_authorized_dispatch.h'
      - 'kernel/src/ipc/g5_ipc_authorized_dispatch.c'
      - '.github/workflows/g5-ipc.yml'
  pull_request:
    paths:
      - 'kernel/include/aurora/g5_ipc_abi.h'
      - 'kernel/src/ipc/g5_ipc_codec.c'
      - 'tests/g5/ipc_codec_test.c'
      - 'tests/g5/ipc_schema_test.c'
      - 'tests/g5/ipc_semantics_test.c'
      - 'tests/g5/ipc_dispatch_test.c'
      - 'tests/g5/ipc_reentry_test.c'
      - 'tests/g5/ipc_concurrency_test.c'
      - 'tests/g5/session_context_test.c'
      - 'kernel/src/graphics/g5_session_context.c'
      - 'kernel/include/aurora/g5_session_context.h'
      - 'tests/g5/ipc_pending_test.c'
      - 'tests/g5/ipc_durable_test.c'
      - 'kernel/include/aurora/g5_ipc_durable.h'
      - 'kernel/src/ipc/g5_ipc_durable.c'
      - 'kernel/include/aurora/g5_ipc_endpoint.h'
      - 'kernel/src/ipc/g5_ipc_endpoint.c'
      - 'kernel/src/ipc/g5_ipc_endpoint_probe.c'
      - 'kernel/include/aurora/g5_ipc_pending.h'
      - 'kernel/src/ipc/g5_ipc_pending.c'
      - 'tests/g5/ipc_session_test.c'
      - 'kernel/include/aurora/g5_ipc_dispatch.h'
      - 'kernel/src/ipc/g5_ipc_dispatch.c'
      - 'kernel/src/ipc/g5_ipc_cap_adapter.c'
      - 'kernel/include/aurora/g5_ipc_cap_adapter.h'
      - 'tests/g5/ipc_cap_adapter_test.c'
      - 'tests/g5/ipc_authorized_dispatch_test.c'
      - 'kernel/include/aurora/g5_ipc_authorized_dispatch.h'
      - 'kernel/src/ipc/g5_ipc_authorized_dispatch.c'
      - '.github/workflows/g5-ipc.yml'
  workflow_dispatch:
jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise host contract tests
        run: |
          mkdir -p build/g5
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c tests/g5/ipc_codec_test.c \
            -o build/g5/ipc_codec_test
          ./build/g5/ipc_codec_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c tests/g5/ipc_schema_test.c \
            -o build/g5/ipc_schema_test
          ./build/g5/ipc_schema_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c tests/g5/ipc_semantics_test.c \
            -o build/g5/ipc_semantics_test
          ./build/g5/ipc_semantics_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c tests/g5/ipc_dispatch_test.c \
            -o build/g5/ipc_dispatch_test
          ./build/g5/ipc_dispatch_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c tests/g5/ipc_reentry_test.c \
            -o build/g5/ipc_reentry_test
          ./build/g5/ipc_reentry_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -pthread \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c tests/g5/ipc_concurrency_test.c \
            -o build/g5/ipc_concurrency_test
          ./build/g5/ipc_concurrency_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/graphics/g5_session_context.c tests/g5/session_context_test.c \
            -o build/g5/session_context_test
          ./build/g5/session_context_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/graphics/g5_session_context.c \
            kernel/src/graphics/g5_surface_configure.c tests/g5/surface_configure_test.c \
            -o build/g5/surface_configure_test
          ./build/g5/surface_configure_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/graphics/g5_session_context.c \
            kernel/src/graphics/g5_surface_configure.c kernel/src/graphics/g5_surface_bridge.c \
            tests/g5/surface_bridge_test.c -o build/g5/surface_bridge_test
          ./build/g5/surface_bridge_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/graphics/g5_session_context.c \
            kernel/src/graphics/g5_surface_configure.c kernel/src/graphics/g5_surface_bridge.c \
            kernel/src/graphics/g5_surface_registry.c tests/g5/surface_registry_test.c \
            -o build/g5/surface_registry_test
          ./build/g5/surface_registry_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/graphics/g5_presentation_queue.c \
            tests/g5/presentation_queue_test.c -o build/g5/presentation_queue_test
          ./build/g5/presentation_queue_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_pending.c tests/g5/ipc_pending_test.c \
            -o build/g5/ipc_pending_test
          ./build/g5/ipc_pending_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c kernel/src/ipc/g5_ipc_durable.c tests/g5/ipc_durable_test.c \
            -o build/g5/ipc_durable_test
          ./build/g5/ipc_durable_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c tests/g5/ipc_session_test.c \
            -o build/g5/ipc_session_test
          ./build/g5/ipc_session_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_cap_adapter.c tests/g5/ipc_cap_adapter_test.c \
            -o build/g5/ipc_cap_adapter_test
          ./build/g5/ipc_cap_adapter_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            -Ikernel/include kernel/src/ipc/g5_ipc_codec.c kernel/src/ipc/g5_ipc_dispatch.c \
            kernel/src/ipc/g5_ipc_cap_adapter.c kernel/src/ipc/g5_ipc_authorized_dispatch.c \
            tests/g5/ipc_authorized_dispatch_test.c -o build/g5/ipc_authorized_dispatch_test
          ./build/g5/ipc_authorized_dispatch_test
