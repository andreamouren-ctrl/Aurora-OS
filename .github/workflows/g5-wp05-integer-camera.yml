name: G5 WP-05 Integer Camera Host
on:
  push:
    paths:
      - 'services/canvas/include/aurora/g5_canvas_integer_camera.h'
      - 'services/canvas/src/g5_canvas_integer_camera.c'
      - 'tests/g5/canvas_integer_camera_test.c'
      - 'tests/g5/canvas_integer_camera_differential_test.c'
      - '.github/workflows/g5-wp05-integer-camera.yml'
  pull_request:
    paths:
      - 'services/canvas/include/aurora/g5_canvas_integer_camera.h'
      - 'services/canvas/src/g5_canvas_integer_camera.c'
      - 'tests/g5/canvas_integer_camera_test.c'
      - 'tests/g5/canvas_integer_camera_differential_test.c'
      - '.github/workflows/g5-wp05-integer-camera.yml'
  workflow_dispatch:
jobs:
  integer-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict host test (GCC and Clang)
        shell: bash
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Iservices/canvas/include \
              services/canvas/src/g5_canvas_integer_camera.c \
              tests/g5/canvas_integer_camera_test.c -o "/tmp/g5-icam-$cc"
            "/tmp/g5-icam-$cc"
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g \
              -fsanitize=undefined -fno-sanitize-recover=all \
              -Iservices/canvas/include \
              services/canvas/src/g5_canvas_integer_camera.c \
              services/canvas/src/g5_canvas_camera.c \
              tests/g5/canvas_integer_camera_differential_test.c \
              -lm -o "/tmp/g5-icam-diff-$cc"
            "/tmp/g5-icam-diff-$cc"
          done
      - name: Freestanding x86-64 code generation audit
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -ffreestanding -fno-builtin -mno-sse -mno-sse2 \
            -Iservices/canvas/include -c \
            services/canvas/src/g5_canvas_integer_camera.c \
            -o /tmp/g5-icam-freestanding.o
          echo "Undefined symbols (must be resolved before Ring 3 linking):"
          nm -u /tmp/g5-icam-freestanding.o || true
          if objdump -d /tmp/g5-icam-freestanding.o | \
             grep -E '\\b(xmm[0-9]+|ymm[0-9]+|zmm[0-9]+)\\b'; then
            echo "Unexpected SIMD register use in freestanding camera"
            exit 1
          fi
          echo "Freestanding compile and SIMD register audit passed"
