name: G5 WP-05 Pan Frame Adapter
on:
  pull_request:
    paths:
      - 'services/canvas/include/aurora/g5_canvas_integer_pan.h'
      - 'services/canvas/include/aurora/g5_canvas_pan_frame.h'
      - 'tests/g5/canvas_pan_frame_test.c'
      - '.github/workflows/g5-wp05-pan-frame.yml'
  workflow_dispatch:
jobs:
  frame:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        run: |
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Iservices/canvas/include tests/g5/canvas_pan_frame_test.c -o /tmp/g5-pan-frame
          /tmp/g5-pan-frame
