name: G5 WP-05 Kernel Origin
on:
  pull_request:
    paths:
      - 'kernel/include/aurora/g5_camera_origin.h'
      - 'kernel/src/session/g5_shell_scene.c'
      - 'tests/g5/camera_origin_kernel_test.c'
      - '.github/workflows/g5-wp05-kernel-origin.yml'
  workflow_dispatch:
jobs:
  kernel-origin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test production origin helper
        run: |
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Ikernel/include tests/g5/camera_origin_kernel_test.c -o /tmp/g5-kernel-origin
          /tmp/g5-kernel-origin
