name: Aurora OS Bootstrap Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            xorriso \
            curl \
            git \
            binutils \
            python3 \
            qemu-system-x86

      - name: Build kernel and ISO
        run: make iso

      - name: Inspect kernel
        run: |
          set -eu

          KERNEL=build/x86_64/aurora-kernel.elf

          file "$KERNEL"
          readelf -h "$KERNEL"
          readelf -S "$KERNEL" | grep limine_requests

          if nm -u "$KERNEL" | grep -q .; then
            echo "Aurora kernel has unresolved symbols:" >&2
            nm -u "$KERNEL" >&2
            exit 1
          fi

      - name: BIOS smoke boot
        run: |
          set -u

          SERIAL_LOG=build/qemu-serial.log
          DEBUG_LOG=build/qemu-debug.log
          STORAGE_IMAGE=build/aurora-storage.img
          rm -f "$SERIAL_LOG" "$DEBUG_LOG" "$STORAGE_IMAGE"
          truncate -s 16M "$STORAGE_IMAGE"

          set +e
          timeout 15s qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -smp 1 \
            -vga std \
            -cdrom build/AuroraOS-x86_64.iso \
            -drive file="$STORAGE_IMAGE",format=raw,if=none,id=aurora_disk \
            -device ide-hd,drive=aurora_disk \
            -serial file:"$SERIAL_LOG" \
            -d int,cpu_reset \
            -D "$DEBUG_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown

          STATUS=$?
          set -e

          # 124 is expected: Aurora intentionally remains alive after boot
          # and timeout terminates the smoke-test VM.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora serial log ====="
          cat "$SERIAL_LOG"

          if ! grep -F \
            "[storage] AHCI controller PCI" \
            "$SERIAL_LOG"; then
            echo "Aurora did not discover the q35 AHCI controller" >&2
            exit 1
          fi

          if ! grep -F \
            "[kernel] M1 user-space bootstrap reached successfully" \
            "$SERIAL_LOG"; then
            echo "===== QEMU interrupt/reset trace (tail) =====" >&2
            tail -n 200 "$DEBUG_LOG" >&2 || true
            exit 1
          fi

      - name: ATA PIO signed-disk smoke boot
        run: |
          set -u

          ATA_SERIAL_LOG=build/qemu-ata-serial.log
          ATA_DEBUG_LOG=build/qemu-ata-debug.log
          ATA_IMAGE=build/aurora-ata-test.img
          rm -f "$ATA_SERIAL_LOG" "$ATA_DEBUG_LOG" "$ATA_IMAGE"
          truncate -s 8M "$ATA_IMAGE"
          printf 'AURORA-STORAGE-TEST-V1' | \
            dd of="$ATA_IMAGE" bs=1 conv=notrunc status=none

          set +e
          timeout 15s qemu-system-x86_64 \
            -M pc \
            -m 512M \
            -smp 1 \
            -vga std \
            -drive file="$ATA_IMAGE",format=raw,if=ide,index=0,media=disk \
            -cdrom build/AuroraOS-x86_64.iso \
            -boot d \
            -serial file:"$ATA_SERIAL_LOG" \
            -d int,cpu_reset \
            -D "$ATA_DEBUG_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown

          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "ATA PIO QEMU exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora ATA serial log ====="
          cat "$ATA_SERIAL_LOG"

          if ! grep -F \
            "[ata] signed test disk read/write probe passed" \
            "$ATA_SERIAL_LOG"; then
            echo "Aurora did not complete the signed ATA PIO read/write probe" >&2
            tail -n 200 "$ATA_DEBUG_LOG" >&2 || true
            exit 1
          fi

          if ! grep -F \
            "[kernel] M1 user-space bootstrap reached successfully" \
            "$ATA_SERIAL_LOG"; then
            echo "Aurora did not reach M1 after ATA PIO probe" >&2
            tail -n 200 "$ATA_DEBUG_LOG" >&2 || true
            exit 1
          fi

      - name: Upload ISO and smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-x86_64
          path: |
            build/AuroraOS-x86_64.iso
            build/qemu-serial.log
            build/qemu-debug.log
            build/qemu-ata-serial.log
            build/qemu-ata-debug.log
