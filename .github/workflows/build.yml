name: Aurora OS Bootstrap Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            xorriso \
            curl \
            git \
            binutils \
            python3 \
            qemu-system-x86

      - name: Build kernel and ISO
        run: make iso

      - name: Inspect kernel
        run: |
          set -eu
          KERNEL=build/x86_64/aurora-kernel.elf
          file "$KERNEL"
          readelf -h "$KERNEL"
          readelf -S "$KERNEL" | grep limine_requests
          if nm -u "$KERNEL" | grep -q .; then
            echo "Aurora kernel has unresolved symbols:" >&2
            nm -u "$KERNEL" >&2
            exit 1
          fi

      - name: Capture real framebuffer frames in QEMU
        run: |
          set -eu

          mkdir -p build/visual
          rm -f build/visual/frame_*.ppm \
                build/qemu-visual-serial.log \
                /tmp/aurora-monitor.sock

          qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -smp 1 \
            -vga std \
            -cdrom build/AuroraOS-x86_64.iso \
            -serial file:build/qemu-visual-serial.log \
            -display none \
            -monitor unix:/tmp/aurora-monitor.sock,server=on,wait=off \
            -no-reboot \
            -no-shutdown &

          QEMU_PID=$!
          export QEMU_PID GITHUB_WORKSPACE

          python3 - <<'PY'
          import os
          import socket
          import time

          monitor = "/tmp/aurora-monitor.sock"
          deadline = time.monotonic() + 10.0

          while not os.path.exists(monitor):
              if time.monotonic() > deadline:
                  raise SystemExit("QEMU monitor socket did not appear")
              time.sleep(0.05)

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.connect(monitor)
          sock.settimeout(0.05)

          try:
              try:
                  sock.recv(4096)
              except (socket.timeout, BlockingIOError):
                  pass

              root = os.environ["GITHUB_WORKSPACE"]
              for index in range(80):
                  target = os.path.join(
                      root,
                      "build",
                      "visual",
                      f"frame_{index:03d}.ppm",
                  )
                  sock.sendall(f"screendump {target}\n".encode("ascii"))
                  time.sleep(0.20)
                  try:
                      sock.recv(4096)
                  except (socket.timeout, BlockingIOError):
                      pass
          finally:
              sock.close()
          PY

          kill "$QEMU_PID" || true
          wait "$QEMU_PID" || true

          FRAME_COUNT=$(find build/visual -name 'frame_*.ppm' | wc -l)
          echo "Captured $FRAME_COUNT real QEMU framebuffer frames"
          test "$FRAME_COUNT" -ge 60

          echo "===== Aurora visual-capture serial log ====="
          cat build/qemu-visual-serial.log

          grep -F \
            "[kernel] M1 user-space bootstrap reached successfully" \
            build/qemu-visual-serial.log

      - name: Upload raw visual capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-boot-visual-frames
          compression-level: 6
          path: |
            build/visual/frame_*.ppm
            build/qemu-visual-serial.log
