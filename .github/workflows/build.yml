name: Aurora OS Bootstrap Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # v6/v7 currently fail before step execution in this repository's Actions environment.
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            xorriso \
            curl \
            git \
            binutils \
            python3 \
            qemu-system-x86 \
            dosfstools \
            mtools \
            exfatprogs \
            exfat-fuse

      - name: Build kernel and ISO
        run: make iso

      - name: Inspect kernel
        run: |
          set -eu

          KERNEL=build/x86_64/aurora-kernel.elf

          file "$KERNEL"
          readelf -h "$KERNEL"
          readelf -S "$KERNEL" | grep limine_requests

          if nm -u "$KERNEL" | grep -q .; then
            echo "Aurora kernel has unresolved symbols:" >&2
            nm -u "$KERNEL" >&2
            exit 1
          fi

      - name: BIOS smoke boot
        run: |
          set -u

          SERIAL_LOG=build/qemu-serial.log
          DEBUG_LOG=build/qemu-debug.log
          STORAGE_IMAGE=build/aurora-storage.img
          rm -f "$SERIAL_LOG" "$DEBUG_LOG" "$STORAGE_IMAGE"
          truncate -s 16M "$STORAGE_IMAGE"

          python3 - "$STORAGE_IMAGE" <<'PY'
          import sys
          path = sys.argv[1]
          signature = b"AURORA-AHCI-RW-TEST-V1"
          with open(path, "r+b") as f:
              f.seek(-512, 2)
              sector = bytearray(512)
              sector[:len(signature)] = signature
              f.write(sector)
          PY

          set +e
          timeout 15s qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -smp 1 \
            -vga std \
            -cdrom build/AuroraOS-x86_64.iso \
            -drive file="$STORAGE_IMAGE",format=raw,if=none,id=aurora_disk \
            -device ide-hd,drive=aurora_disk \
            -serial file:"$SERIAL_LOG" \
            -d int,cpu_reset \
            -D "$DEBUG_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown

          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora serial log ====="
          cat "$SERIAL_LOG"

          if ! grep -F \
            "[storage] AHCI controller PCI" \
            "$SERIAL_LOG"; then
            echo "Aurora did not discover the q35 AHCI controller" >&2
            exit 1
          fi

          grep -F "[ahci] READ DMA EXT LBA0 via block layer verified" "$SERIAL_LOG"
          grep -F "[ahci] signed WRITE DMA EXT + FLUSH CACHE EXT probe passed and restored" "$SERIAL_LOG"
          grep -F "[exfat] synthetic 4096-byte logical-block probe/mount self-test passed" "$SERIAL_LOG"
          grep -F "[aurorafs-v2] mounted at /system via common filesystem framework" "$SERIAL_LOG"
          grep -F "[vfs] AuroraFS v2 mounted-path mutation routing verified" "$SERIAL_LOG"

          if ! grep -F \
            "[kernel] M1 user-space bootstrap reached successfully" \
            "$SERIAL_LOG"; then
            echo "===== QEMU interrupt/reset trace (tail) =====" >&2
            tail -n 200 "$DEBUG_LOG" >&2 || true
            exit 1
          fi

      - name: ATA PIO, AuroraFS, FAT32 and exFAT smoke boot
        run: |
          set -u

          ATA_SERIAL_LOG=build/qemu-ata-serial.log
          ATA_SERIAL_LOG_2=build/qemu-ata-serial-second.log
          ATA_DEBUG_LOG=build/qemu-ata-debug.log
          ATA_DEBUG_LOG_2=build/qemu-ata-debug-second.log
          ATA_IMAGE=build/aurora-ata-test.img
          FAT_IMAGE=build/fat32-partition.img
          EXFAT_IMAGE=build/exfat-partition.img
          EXFAT_MOUNT=build/exfat-mount

          FAT_START=2048
          FAT_SECTORS=196608
          EXFAT_START=200704
          EXFAT_SECTORS=131072

          rm -f "$ATA_SERIAL_LOG" "$ATA_SERIAL_LOG_2" \
            "$ATA_DEBUG_LOG" "$ATA_DEBUG_LOG_2" "$ATA_IMAGE" \
            "$FAT_IMAGE" "$EXFAT_IMAGE"
          rm -rf "$EXFAT_MOUNT"

          truncate -s 256M "$ATA_IMAGE"
          truncate -s $((FAT_SECTORS * 512)) "$FAT_IMAGE"
          truncate -s $((EXFAT_SECTORS * 512)) "$EXFAT_IMAGE"

          mkfs.fat -F 32 -n AURORA_FAT "$FAT_IMAGE"
          printf 'AURORA-FAT32-EXTERNAL-IMAGE' > build/AURORA.TXT
          printf 'AURORA-FAT32-LFN-UNICODE' > 'build/Documento Aurora è.txt'
          mcopy -o -i "$FAT_IMAGE" build/AURORA.TXT ::/AURORA.TXT
          mcopy -o -i "$FAT_IMAGE" \
            'build/Documento Aurora è.txt' '::/Documento Aurora è.txt'

          mkfs.exfat -L AURORAEXFAT "$EXFAT_IMAGE"
          mkdir -p "$EXFAT_MOUNT"
          printf 'AURORA-EXFAT-EXTERNAL-IMAGE' > 'build/Grande Aurora.txt'
          EXFAT_LOOP=$(sudo losetup --find --show "$EXFAT_IMAGE")
          sudo mount.exfat-fuse "$EXFAT_LOOP" "$EXFAT_MOUNT"
          sudo cp 'build/Grande Aurora.txt' "$EXFAT_MOUNT/Grande Aurora.txt"
          sync
          sudo umount "$EXFAT_MOUNT"
          sudo losetup -d "$EXFAT_LOOP"

          python3 - "$ATA_IMAGE" "$FAT_START" "$FAT_SECTORS" \
            "$EXFAT_START" "$EXFAT_SECTORS" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          fat_start = int(sys.argv[2])
          fat_sectors = int(sys.argv[3])
          exfat_start = int(sys.argv[4])
          exfat_sectors = int(sys.argv[5])

          mbr = bytearray(512)
          signature = b"AURORA-STORAGE-TEST-V1"
          mbr[:len(signature)] = signature

          def add_partition(index, ptype, first_lba, sector_count):
              entry = 446 + index * 16
              mbr[entry + 0] = 0x00
              mbr[entry + 1:entry + 4] = b"\x00\x02\x00"
              mbr[entry + 4] = ptype
              mbr[entry + 5:entry + 8] = b"\xFE\xFF\xFF"
              struct.pack_into("<I", mbr, entry + 8, first_lba)
              struct.pack_into("<I", mbr, entry + 12, sector_count)

          add_partition(0, 0x0C, fat_start, fat_sectors)
          add_partition(1, 0x07, exfat_start, exfat_sectors)
          mbr[510:512] = b"\x55\xAA"

          with open(path, "r+b") as f:
              f.write(mbr)
          PY

          dd if="$FAT_IMAGE" of="$ATA_IMAGE" bs=512 seek="$FAT_START" \
            conv=notrunc status=none
          dd if="$EXFAT_IMAGE" of="$ATA_IMAGE" bs=512 seek="$EXFAT_START" \
            conv=notrunc status=none

          set +e
          timeout 15s qemu-system-x86_64 \
            -M pc \
            -m 512M \
            -smp 1 \
            -vga std \
            -drive file="$ATA_IMAGE",format=raw,if=ide,index=0,media=disk \
            -cdrom build/AuroraOS-x86_64.iso \
            -boot d \
            -serial file:"$ATA_SERIAL_LOG" \
            -d int,cpu_reset \
            -D "$ATA_DEBUG_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "ATA PIO QEMU exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora ATA first boot serial log ====="
          cat "$ATA_SERIAL_LOG"

          grep -F "[ata] signed test disk read/write/flush probe passed" "$ATA_SERIAL_LOG"
          grep -F "[exfat] synthetic 4096-byte logical-block probe/mount self-test passed" "$ATA_SERIAL_LOG"
          grep -F "[aurorafs-v2] formatted system filesystem" "$ATA_SERIAL_LOG"
          grep -F "[aurorafs-v2] persistent file created" "$ATA_SERIAL_LOG"
          grep -F "[aurorafs-v2] mounted at /system via common filesystem framework" "$ATA_SERIAL_LOG"
          grep -F "[vfs] AuroraFS v2 mounted-path mutation routing verified" "$ATA_SERIAL_LOG"
          grep -F "[partition] discovered: 2" "$ATA_SERIAL_LOG"
          grep -F "[fs] detected FAT32 on partition 1" "$ATA_SERIAL_LOG"
          grep -F "[fat32] external image mounted read-only" "$ATA_SERIAL_LOG"
          grep -F "[fat32] external file read verified" "$ATA_SERIAL_LOG"
          grep -F "[fat32] VFAT long Unicode filename verified" "$ATA_SERIAL_LOG"
          grep -F "[vfs] FAT32 mounted-path routing verified" "$ATA_SERIAL_LOG"
          grep -F "[fs] detected exFAT on partition 2" "$ATA_SERIAL_LOG"
          grep -F "[exfat] external image mounted read-only" "$ATA_SERIAL_LOG"
          grep -F "[exfat] external file read verified" "$ATA_SERIAL_LOG"
          grep -F "[exfat] 64-bit file length path active" "$ATA_SERIAL_LOG"
          grep -F "[vfs] exFAT mounted-path routing verified" "$ATA_SERIAL_LOG"
          grep -F "[kernel] M1 user-space bootstrap reached successfully" "$ATA_SERIAL_LOG"

          set +e
          timeout 15s qemu-system-x86_64 \
            -M pc \
            -m 512M \
            -smp 1 \
            -vga std \
            -drive file="$ATA_IMAGE",format=raw,if=ide,index=0,media=disk \
            -cdrom build/AuroraOS-x86_64.iso \
            -boot d \
            -serial file:"$ATA_SERIAL_LOG_2" \
            -d int,cpu_reset \
            -D "$ATA_DEBUG_LOG_2" \
            -display none \
            -no-reboot \
            -no-shutdown
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "AuroraFS second QEMU boot exited unexpectedly with status $STATUS" >&2
            exit "$STATUS"
          fi

          echo "===== Aurora ATA second boot serial log ====="
          cat "$ATA_SERIAL_LOG_2"

          if ! grep -F "[aurorafs-v2] persistent file reopened" "$ATA_SERIAL_LOG_2"; then
            echo "AuroraFS v2 did not recover the persistent file after reboot" >&2
            tail -n 200 "$ATA_DEBUG_LOG_2" >&2 || true
            exit 1
          fi

          grep -F "[aurorafs-v2] mounted at /system via common filesystem framework" "$ATA_SERIAL_LOG_2"
          grep -F "[vfs] AuroraFS v2 mounted-path mutation routing verified" "$ATA_SERIAL_LOG_2"
          grep -F "[fat32] external file read verified" "$ATA_SERIAL_LOG_2"
          grep -F "[fat32] VFAT long Unicode filename verified" "$ATA_SERIAL_LOG_2"
          grep -F "[vfs] FAT32 mounted-path routing verified" "$ATA_SERIAL_LOG_2"
          grep -F "[exfat] external file read verified" "$ATA_SERIAL_LOG_2"
          grep -F "[vfs] exFAT mounted-path routing verified" "$ATA_SERIAL_LOG_2"
          grep -F "[kernel] M1 user-space bootstrap reached successfully" "$ATA_SERIAL_LOG_2"

      - name: Upload ISO and smoke-test logs
        if: always()
        # Keep v4 with checkout v4 until newer action majors are accepted by this Actions environment.
        uses: actions/upload-artifact@v4
        with:
          name: AuroraOS-x86_64
          path: |
            build/AuroraOS-x86_64.iso
            build/qemu-serial.log
            build/qemu-debug.log
            build/qemu-ata-serial.log
            build/qemu-ata-serial-second.log
            build/qemu-ata-debug.log
            build/qemu-ata-debug-second.log
