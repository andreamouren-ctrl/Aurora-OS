name: IPC Syscall Compile Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernel/src/arch/x86_64/syscall.c'
      - 'kernel/src/ipc/ipc.c'
      - 'kernel/src/security/capability.c'
      - 'kernel/tests/test_ipc_transport_host.c'
      - 'kernel/tests/test_ipc_concurrent_host.c'
      - 'kernel/tests/test_ipc_escrow_host.c'
      - 'kernel/include/aurora/**'
      - 'kernel/Makefile'
      - 'kernel/tests/check_ipc_syscall_cleanup.py'
      - '.github/workflows/ipc-syscall-compile.yml'
  push:
    paths:
      - 'kernel/src/arch/x86_64/syscall.c'
      - 'kernel/src/ipc/ipc.c'
      - 'kernel/src/security/capability.c'
      - 'kernel/tests/test_ipc_transport_host.c'
      - 'kernel/include/aurora/**'
      - 'kernel/Makefile'
      - 'kernel/tests/check_ipc_syscall_cleanup.py'
      - '.github/workflows/ipc-syscall-compile.yml'

permissions:
  contents: read

jobs:
  compile-syscall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check IPC syscall cleanup invariants
        run: |
          python3 kernel/tests/check_ipc_syscall_cleanup.py
      - name: Compile production kernel syscall translation unit
        run: |
          clang -target x86_64-unknown-none-elf -std=c11 \
            -DAURORA_BOOT_VALIDATION=0 -DAURORA_NVME_RW_PROBE_ONLY=0 \
            -O2 -g -Wall -Wextra -Werror -ffreestanding \
            -fno-stack-protector -fno-stack-check -fno-pic -fno-pie \
            -fno-common -ffunction-sections -fdata-sections \
            -m64 -march=x86-64 -mno-red-zone -mno-mmx -mno-sse \
            -mno-sse2 -mcmodel=kernel -Ikernel/include \
            -Ithird_party/limine-protocol/include \
            -c kernel/src/arch/x86_64/syscall.c -o /tmp/aurora-ipc-syscall.o
      - name: Compile production IPC transport translation unit
        run: |
          clang -target x86_64-unknown-none-elf -std=c11 \
            -DAURORA_BOOT_VALIDATION=0 -DAURORA_NVME_RW_PROBE_ONLY=0 \
            -O2 -g -Wall -Wextra -Werror -ffreestanding \
            -fno-stack-protector -fno-stack-check -fno-pic -fno-pie \
            -fno-common -ffunction-sections -fdata-sections \
            -m64 -march=x86-64 -mno-red-zone -mno-mmx -mno-sse \
            -mno-sse2 -mcmodel=kernel -Ikernel/include \
            -Ithird_party/limine-protocol/include \
            -c kernel/src/ipc/ipc.c -o /tmp/aurora-ipc-transport.o
      - name: Run production IPC transport host self-test
        run: |
          cc -std=c11 -O1 -Wall -Wextra -Werror -Ikernel/include \
            kernel/tests/test_ipc_transport_host.c -o /tmp/aurora-ipc-host
          /tmp/aurora-ipc-host

      - name: Run IPC host test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikernel/include kernel/tests/test_ipc_transport_host.c \
            -o /tmp/aurora-ipc-host-sanitized
          /tmp/aurora-ipc-host-sanitized
      - name: Run concurrent IPC lifecycle regression under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikernel/include kernel/tests/test_ipc_concurrent_host.c \
            -o /tmp/aurora-ipc-concurrent-sanitized
          /tmp/aurora-ipc-concurrent-sanitized
      - name: Run IPC endpoint escrow regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ikernel/include kernel/tests/test_ipc_escrow_host.c \
            -o /tmp/aurora-ipc-escrow-host
          /tmp/aurora-ipc-escrow-host
